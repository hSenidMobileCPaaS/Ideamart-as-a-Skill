description = "Build or debug an OmniAI (Ideamart AI gateway) integration"
prompt = "Work on this OmniAI task: {{args}}. Run `node tools/ideamart.mjs omniai` for the contract and `node tools/ideamart.mjs show omniai-chat-completions` or `omniai-image-generation` for the exact parameters; read references/14-omni-ai.md. OmniAI is NOT the telco platform: the key goes in an Authorization header verbatim with no Bearer prefix, failures are real HTTP status codes with an error object rather than an S1000 envelope, and it needs its own client separate from the telco one. Cap every call with max_completion_tokens, never let an MSISDN or subscriberId reach a prompt, check finish_reason before using the content, and never call a model inside a callback response path."
