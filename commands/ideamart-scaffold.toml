description = "Scaffold a new Ideamart integration — config, client, types, callbacks"
prompt = "Scaffold an Ideamart integration for: {{args}}. Follow the ideamart-scaffold skill. Build in order: (1) .env plus .env.example plus a config module that validates at startup, so no credential can land in source; (2) one client with a single post() helper that injects credentials, sets a timeout, and branches on statusCode; (3) the callback handlers, which acknowledge before doing work and deduplicate. Get every contract from `node tools/ideamart.mjs show <id>`. Match this project's existing stack and conventions."
