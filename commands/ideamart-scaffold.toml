description = "Scaffold a new Ideamart integration — config, client, types, callbacks"
prompt = "Scaffold an Ideamart integration for: {{args}}. Follow the ideamart-scaffold skill. Write it in this project's existing language and framework — Ideamart is JSON over HTTPS and templates/ ships working code for TypeScript/Node, Python, Java, Go, PHP and C#, with references/11-any-stack.md covering anything else. Never add a second runtime for this. Build in order: (1) .env plus .env.example plus a config module that validates at startup, so no credential can land in source; (2) one client with a single post() helper that injects credentials, sets a timeout, and branches on statusCode; (3) the callback handlers, which acknowledge before doing work and deduplicate. Get every contract from `node tools/ideamart.mjs show <id>`."
