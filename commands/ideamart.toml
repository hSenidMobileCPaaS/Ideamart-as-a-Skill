description = "Work on an Ideamart integration (SMS, USSD, Subscription, OTP, CaaS, LBS)"
prompt = "Use the Ideamart skill for this task. Ideamart is Dialog Axiata's Sri Lankan telco platform. Before writing code, query the contract rather than recalling it: run `node tools/ideamart.mjs list` and `node tools/ideamart.mjs show <id>` for each service involved. Non-negotiable: credentials come from environment variables and are never in source, a client bundle, or a log; Ideamart is called from the backend only; branch on statusCode because HTTP 200 does not mean success; charging is idempotent on externalTrxId. Write the integration in whatever language this project already uses — templates/ covers TypeScript/Node, Python, Java, Go, PHP and C#, and references/11-any-stack.md specifies the same integration for any other stack. Task: {{args}}"
